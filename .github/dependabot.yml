---
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - thechelsuk
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/"
    assignees:
      - thechelsuk
    schedule:
      interval: "weekly"

  - package-ecosystem: "bundler"
    directory: "/"
    assignees:
      - thechelsuk
    schedule:
      interval: "weekly"
