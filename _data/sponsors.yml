# Sponsors for the card on the dashboard.
#
# Add one entry per booking. The card shows the first entry whose dates
# include today (start and end are both inclusive, YYYY-MM-DD). When no
# entry is active, a "Sponsor this site" placeholder is shown instead.
#
# The site rebuilds when the feed updates (07:00 and 14:00 UTC), so a
# sponsor goes live or comes down at the first build on or after its date.
#
#   - name: Acme Security                  # sponsor name, used as alt text
#     title: Find exposed secrets in minutes
#     description: Scan your repos and CI logs for leaked keys. Free for open source.
#     url: https://example.com/              # ?r=thechelsuk is added automatically
#     logo: /assets/sponsors/acme.png      # square image, 96×96 or larger
#     start: 2026-11-01
#     end: 2026-11-30

